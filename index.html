<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Wedding 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sage: #9CA479;
      --sage-dark: #7a8360;
      --sage-light: #d6ddc3;
      --blush: #f5ede8;
      --cream: #fdfaf6;
      --warm: #fffcf8;
      --text: #2e2b27;
      --dust: #c4b49a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'EB Garamond', serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Watercolour wash background ─────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 15% 20%, rgba(156,164,121,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 85% 75%, rgba(196,180,154,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 80% 40% at 50% 50%, rgba(245,237,232,0.4) 0%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Botanical SVG corners ───────────────────────────── */
    .botanical {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
    }
    .botanical-tl { top: -10px; left: -10px; width: 280px; }
    .botanical-br { bottom: -10px; right: -10px; width: 280px; transform: rotate(180deg); }
    .botanical-tr { top: -10px; right: -10px; width: 200px; transform: scaleX(-1); }
    .botanical-bl { bottom: -10px; left: -10px; width: 200px; transform: scaleY(-1); }

    /* ── Floating leaves ─────────────────────────────────── */
    .leaf {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(-80px) translateX(0) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.65; }
      92%  { opacity: 0.4; }
      100% { transform: translateY(110vh) translateX(40px) rotate(320deg); opacity: 0; }
    }

    /* ── Layout ──────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr min(560px, 88vw) 1fr;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: 48px 0;
      gap: 0;
    }

    .center-col {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* ── Monogram wreath ─────────────────────────────────── */
    .wreath-wrap {
      margin-bottom: 24px;
      opacity: 0;
      animation: riseIn 1.2s 0.2s cubic-bezier(.22,1,.36,1) forwards;
    }

    /* ── Typography ──────────────────────────────────────── */
    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--sage-dark);
      margin-bottom: 14px;
      opacity: 0;
      animation: riseIn 1s 0.5s forwards;
    }

    h1 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(3.2rem, 9vw, 6.5rem);
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 28px;
      opacity: 0;
      animation: riseIn 1.2s 0.7s forwards;
    }

    /* ── Botanical rule ──────────────────────────────────── */
    .botanical-rule {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      opacity: 0;
      animation: riseIn 1s 0.9s forwards;
    }
    .rule-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sage), transparent);
    }

    /* ── Quote ───────────────────────────────────────────── */
    .quote {
      font-style: italic;
      font-size: 1.05rem;
      color: var(--dust);
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 32px;
      opacity: 0;
      animation: riseIn 1s 1.1s forwards;
    }

    /* ── Venue photo ─────────────────────────────────────── */
    .venue-frame {
      position: relative;
      margin-bottom: 36px;
      opacity: 0;
      animation: riseIn 1s 1.25s forwards;
    }
    .venue-frame::before {
      content: '';
      position: absolute;
      inset: -8px;
      border: 1px solid var(--sage-light);
      border-radius: 1px;
      pointer-events: none;
    }
    .venue-frame::after {
      content: '';
      position: absolute;
      inset: -16px;
      border: 1px solid var(--sage-light);
      opacity: 0.5;
      border-radius: 1px;
      pointer-events: none;
    }
    .venue-img {
      display: block;
      width: min(460px, 82vw);
      border-radius: 1px;
      filter: sepia(8%) saturate(90%);
    }

    /* ── Enter button ────────────────────────────────────── */
    .enter-btn {
      position: relative;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--sage-dark);
      background: transparent;
      border: 1px solid var(--sage);
      padding: 16px 56px;
      cursor: pointer;
      transition: all 0.35s;
      opacity: 0;
      animation: riseIn 1s 1.45s forwards;
    }
    .enter-btn::before,
    .enter-btn::after {
      content: '';
      position: absolute;
      background: var(--sage);
      transition: all 0.35s;
    }
    /* top-left corner accent */
    .enter-btn::before { top: -4px; left: -4px; width: 10px; height: 1px; }
    .enter-btn::after  { top: -4px; left: -4px; width: 1px; height: 10px; }
    .enter-btn:hover {
      background: var(--sage);
      color: var(--warm);
      box-shadow: 0 6px 28px rgba(156,164,121,0.3);
      transform: translateY(-2px);
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer-date {
      grid-column: 2;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: var(--dust);
      text-transform: uppercase;
      margin-top: 40px;
      opacity: 0;
      animation: riseIn 1s 1.6s forwards;
    }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,18,15,0.78);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.35s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: var(--warm);
      max-width: 620px;
      width: 100%;
      padding: 44px 36px 32px;
      position: relative;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
      animation: slideUp 0.4s cubic-bezier(.22,1,.36,1);
    }
    @keyframes slideUp {
      from { transform: translateY(40px) scale(0.96); opacity: 0; }
      to   { transform: translateY(0)    scale(1);    opacity: 1; }
    }

    .modal-close {
      position: absolute;
      top: 14px; right: 18px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--dust);
      background: none;
      border: none;
      transition: color 0.2s;
      font-family: 'EB Garamond', serif;
      letter-spacing: 0.1em;
    }
    .modal-close:hover { color: var(--text); }

    .modal-heading {
      font-family: 'Pinyon Script', cursive;
      font-size: 2.4rem;
      color: var(--sage-dark);
      margin-bottom: 20px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #111;
      overflow: hidden;
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .lol-text {
      margin-top: 16px;
      font-style: italic;
      font-size: 1rem;
      color: var(--dust);
      letter-spacing: 0.06em;
    }

    /* ── Keyframe ────────────────────────────────────────── */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- ── Page ─────────────────────────────────────────────── -->
<div class="page">
  <div class="center-col">

    <!-- Monogram wreath -->
    <div class="wreath-wrap">
      <svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#9CA479" stroke-linecap="round">
          <!-- left arc -->
          <path d="M 30 55 Q 18 30 32 12" stroke-width="1.2"/>
          <path d="M 30 55 Q 16 68 28 88" stroke-width="1.2"/>

          <path d="M 80 55 Q 92 30 78 12" stroke-width="1.2"/>

          <ellipse cx="24" cy="28" rx="8" ry="3" fill="#9CA479" opacity="0.4" transform="rotate(-50 24 28)"/>

<!-- ── Modal ──────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">✕ close</button>
    <p class="modal-heading">Surprise! 🎉</p>
    <div class="video-wrap" id="videoWrap"></div>
    <p class="lol-text">lol heres the actual link</p>
  </div>
</div>

<script>
  /* ── Modal ─────────────────────────────────────────────── */
  function openModal() {
    document.getElementById('modal').classList.add('active');
    const wrap = document.getElementById('videoWrap');
    if (!wrap.querySelector('iframe')) {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/xvFZjo5PgG0?si=JklaamWeaWpfIvTk&autoplay=1&mute=0';
      iframe.title = 'YouTube video player';
      iframe.frameBorder = '0';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      iframe.allowFullscreen = true;
      wrap.appendChild(iframe);
    }
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('videoWrap').innerHTML = '';
  }
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  /* ── Floating leaves ───────────────────────────────────── */
  const leafShapes = [
    `<ellipse cx="10" cy="10" rx="5" ry="9" fill="COLOR" transform="rotate(ANGLE 10 10)"/>`,
    `<path d="M10 1 Q18 8 10 18 Q4 11 10 1Z" fill="COLOR"/>`,
    `<path d="M10 2 Q17 6 16 14 Q10 18 4 14 Q3 6 10 2Z" fill="COLOR"/>`,
  ];
  const leafColors = ['#9CA479','#b8c49a','#c5ceac','#7a8360','#d6ddc3'];

  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'leaf';
    const size = 12 + Math.random() * 16;
    const c = leafColors[Math.floor(Math.random() * leafColors.length)];
    const angle = Math.random() * 360;
    const shape = leafShapes[Math.floor(Math.random() * leafShapes.length)]
      .replace('COLOR', c).replace('ANGLE', angle);
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" opacity="0.65">${shape}</svg>`;
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (7 + Math.random() * 10) + 's';
    el.style.animationDelay    = (Math.random() * 14) + 's';
    document.body.appendChild(el);
  }
</script>
</body>
